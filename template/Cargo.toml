[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
{%- if msrv_profile == "library" %}
# MSRV: library profile (see AGENTS.md). Keep below rust-toolchain.toml and
# check with `just msrv`. Raising it is a CHANGELOG entry.
rust-version = "1.97"
{%- else %}
# MSRV: application profile (see AGENTS.md). Bump together with
# rust-toolchain.toml.
rust-version = "1.99"
publish = false
{%- endif %}
description = "{{description}}"
license = "{{license}}"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Lint levels live here, not in source attributes. They are warnings so local
# work is not blocked; CI turns every warning into an error with -D warnings.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
allow_attributes_without_reason = "warn"
